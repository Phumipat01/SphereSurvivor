<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sphere Survivor</title>
    <style>
        body { margin: 0; padding: 0; background-color: #111; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        #game-container { position: relative; }
        canvas { border: 2px solid #444; background-color: #222; box-shadow: 0 0 20px rgba(0,0,0,0.8); display: block; }
        #exp-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 12px; background: rgba(0, 0, 0, 0.6); border-bottom: 1px solid #444; }
        #exp-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #0088ff, #00ffcc); box-shadow: 0 0 8px #00ffcc; transition: width 0.1s ease; }
        #ui { position: absolute; top: 18px; left: 15px; font-size: 15px; text-shadow: 2px 2px 4px #000; pointer-events: none; font-weight: bold; }
        .modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 15, 20, 0.95); padding: 25px 35px; border-radius: 12px; text-align: center; border: 2px solid #555; box-shadow: 0 0 30px rgba(0,0,0,0.9); width: 360px; }
        .upgrade-btn { display: block; width: 100%; padding: 10px; margin: 6px 0; font-size: 14px; font-weight: bold; background: #2a2a3a; color: #00ffcc; border: 1px solid #00ffcc; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .upgrade-btn:hover { background: #00ffcc; color: #111; }
        .btn-action { padding: 10px 20px; font-size: 16px; background: #ff4444; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .btn-action:hover { background: #cc0000; }
        #banner { display: none; position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; font-weight: bold; text-shadow: 0 0 10px #ff0000; pointer-events: none; text-align: center; }
        input[type="text"] { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #00ffcc; background: #222; color: #fff; text-align: center; width: 80%; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="exp-wrapper"><div id="exp-bar"></div></div>
        <canvas id="gameCanvas" width="1920" height="1080"></canvas>
        <div id="ui">
            <div style="color: #00ffcc; font-size: 16px;">HERO: <span id="hero-name-val">Player</span></div>
            <div style="color: #ffcc00; font-size: 18px;">STAGE: <span id="stage-val">1</span> / 20</div>
            <div>กำจัดศัตรู: <span id="kills-val">0</span> / <span id="target-kills-val">5</span> ตัว</div>
            <div>LV: <span id="level-val" style="color: #00ffcc;">1</span> (<span id="exp-val">0</span>/<span id="next-exp-val">5</span> EXP)</div>
            <div>SPEED: <span id="speed-val" style="color: #00ffcc;">3.0</span> | BULLETS: <span id="bullet-count-val" style="color: #ffff00;">1</span></div>
            <div>HP: <span id="hp-val" style="color: #ff5555;">100</span> / <span id="max-hp-val">100</span> | DEF: <span id="armor-val" style="color: #aaa;">0</span></div>
            <div>Score: <span id="score-val">0</span></div>
        </div>
        <div id="banner"></div>

        <div id="start-modal" class="modal" style="display: block;">
            <h2 style="color: #00ffcc; margin-top: 0;">ตั้งชื่อผู้กล้าของคุณ</h2>
            <input type="text" id="player-name-input" placeholder="พิมพ์ชื่อผู้เล่น..." maxlength="15" value="ShadowKnight">
            <br><button class="btn-action" style="background: #00ffcc; color: #111;" onclick="startGame()">เริ่มเล่นเกม</button>
        </div>

        <div id="level-up-modal" class="modal">
            <h2 style="color: #00ffcc; margin-top: 0;">LEVEL UP!</h2>
            <p style="font-size: 13px; color: #aaa; margin-bottom: 8px;">เลือกความสามารถเพิ่มพลัง:</p>
            <div id="upgrade-options"></div>
        </div>

        <div id="game-over" class="modal">
            <h1 id="game-over-title" style="color: #ff4444; margin: 0 0 10px 0;">GAME OVER</h1>
            <p>ผู้กล้า: <span id="final-hero-name" style="color: #00ffcc;">-</span></p>
            <p>ติดอยู่ที่ด่าน: <span id="final-stage">1</span></p>
            <p>คะแนนรวม: <span id="final-score">0</span></p>
            <button class="btn-action" onclick="restartGame()">เล่นใหม่อีกครั้ง</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const UI = {
    heroName: document.getElementById('hero-name-val'), hp: document.getElementById('hp-val'), maxHp: document.getElementById('max-hp-val'),
    armor: document.getElementById('armor-val'), speed: document.getElementById('speed-val'), bulletCount: document.getElementById('bullet-count-val'),
    score: document.getElementById('score-val'), level: document.getElementById('level-val'), exp: document.getElementById('exp-val'),
    nextExp: document.getElementById('next-exp-val'), stage: document.getElementById('stage-val'), kills: document.getElementById('kills-val'),
    targetKills: document.getElementById('target-kills-val'), expBar: document.getElementById('exp-bar')
};

const Modals = {
    start: document.getElementById('start-modal'), levelUp: document.getElementById('level-up-modal'),
    upgradeOptions: document.getElementById('upgrade-options'), gameOver: document.getElementById('game-over'), banner: document.getElementById('banner')
};

let keys = {}, score = 0, isGameOver = false, isPaused = true, frameCount = 0;
let stage = 1, stageKills = 0, targetKills = 5, bossSpawned = false, bossDefeated = false;
const maxStages = 20;

const player = {
    name: "ShadowKnight", x: 400, y: 300, radius: 12, color: '#00ffcc', speed: 3.0,
    hp: 100, maxHp: 100, armor: 0, level: 1, exp: 0, nextExp: 5,
    attackCooldown: 0, attackRate: 30, damage: 1, bulletCount: 1, bulletSpeed: 7, attackRange: 280,
    magnetRange: 100, sawCount: 0, sawAngle: 0, sawActiveTimer: 0, sawCooldownTimer: 0, sawIsActive: true
};

let bullets = [], enemies = [], gems = [];

window.addEventListener('keydown', e => { keys[e.key] = true; if(e.code) keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; if(e.code) keys[e.code] = false; });

function startGame() {
    const inputName = document.getElementById('player-name-input').value.trim();
    if (inputName) player.name = inputName;
    UI.heroName.textContent = player.name;
    Modals.start.style.display = 'none';
    isPaused = false;
    gameLoop();
}

function showBanner(text, color = '#ff0000', duration = 2000) {
    Modals.banner.textContent = text;
    Modals.banner.style.color = color;
    Modals.banner.style.textShadow = `0 0 10px ${color}`;
    Modals.banner.style.display = 'block';
    setTimeout(() => { Modals.banner.style.display = 'none'; }, duration);
}

function spawnEnemy() {
    // ถ้าบอสเกิดมาแล้ว จะไม่สปอว์นศัตรูตัวอื่นเพิ่มเติมเลย
    if (bossSpawned) return;

    const isBossStage = stage % 5 === 0;

    // หากเป็นด่านบอส และฆ่าลูกน้องเกือบครบโควต้า ให้เสกบอสออกมา
    if (isBossStage && stageKills >= targetKills - 1) {
        bossSpawned = true;
        bossDefeated = false;
        showBanner(`⚠️ WARNING: BOSS STAGE ${stage}! ⚠️`, '#ff0000', 3000);
        
        const baseEnemyHp = 3 + (stage - 1) * 2.5;
        const bossHp = Math.floor(baseEnemyHp * (12 + stage * 0.5));
        let bossColor = '#ff0055';
        let bossRadius = 30;

        if (stage === 10) bossColor = '#ff6600';
        else if (stage === 15) bossColor = '#cc00ff';
        else if (stage === 20) { bossColor = '#990000'; bossRadius = 38; }

        enemies.push({ x: canvas.width / 2, y: -50, radius: bossRadius, color: bossColor, speed: 0.9, hp: bossHp, maxHp: bossHp, isBoss: true });
        return;
    }

    const maxEnemiesOnScreen = 8 + (stage * 2);
    if (enemies.length >= maxEnemiesOnScreen) return;

    let x, y;
    if (Math.random() < 0.5) { x = Math.random() < 0.5 ? -20 : canvas.width + 20; y = Math.random() * canvas.height; } 
    else { x = Math.random() * canvas.width; y = Math.random() < 0.5 ? -20 : canvas.height + 20; }
    
    let hp = 3 + (stage - 1) * 2.5;
    // ปรับศัตรูให้เดินช้าลงเล็กน้อย
    let speed = 0.8 + (stage * 0.04);
    let color = stage >= 16 ? '#990000' : stage >= 11 ? '#a000ff' : stage >= 6 ? '#ff8800' : '#ff4444';
    
    if (stage >= 16) { hp = Math.floor(hp * 1.25); speed += 0.2; }
    else if (stage >= 11) { hp = Math.floor(hp * 1.15); speed += 0.15; }
    else if (stage >= 6) { hp = Math.floor(hp * 1.08); speed += 0.1; }

    enemies.push({ x, y, radius: 10, color, speed: Math.min(speed, 2.5), hp: Math.floor(hp), maxHp: Math.floor(hp), isBoss: false });
}

function autoAttack() {
    if (!enemies.length) return;
    let targets = enemies.filter(e => Math.hypot(e.x - player.x, e.y - player.y) <= player.attackRange)
                         .sort((a, b) => Math.hypot(a.x - player.x, a.y - player.y) - Math.hypot(b.x - player.x, b.y - player.y));

    for (let i = 0; i < Math.min(player.bulletCount, targets.length); i++) {
        const angle = Math.atan2(targets[i].y - player.y, targets[i].x - player.x);
        bullets.push({ x: player.x, y: player.y, startX: player.x, startY: player.y, vx: Math.cos(angle) * player.bulletSpeed, vy: Math.sin(angle) * player.bulletSpeed, radius: 5, color: '#ffff00', damage: player.damage });
    }
}

function addExp(amount) {
    player.exp += amount;
    while (player.exp >= player.nextExp) {
        player.exp -= player.nextExp;
        player.level++;
        player.nextExp *= 2;
        triggerLevelUp();
    }
    updateUI();
}

function triggerLevelUp() {
    isPaused = true;
    Modals.upgradeOptions.innerHTML = '';
    const upgrades = [
        { name: "💥 เพิ่มพลังโจมตี (+1)", action: () => player.damage += 1 },
        { name: `🏹 เพิ่มจำนวนกระสุน (+1) [ปัจจุบัน: ${player.bulletCount}]`, action: () => player.bulletCount += 1 },
        { name: "⚡ เพิ่มความเร็วการยิง (+1)", action: () => player.attackRate = Math.max(6, player.attackRate - 2) },
        { name: "🏃 เพิ่มความเร็วการเดิน (+0.2)", action: () => player.speed += 0.2 },
        { name: "🛡️ เกราะป้องกันความเสียหาย (-2)", action: () => player.armor += 2 },
        { name: "💣 ระเบิดกวาดล้างศัตรูทันที", action: () => { enemies.forEach(e => e.hp -= (player.damage + 10)); showBanner("BOOM!", "#ffaa00", 1000); }},
        { name: "🧲 เพิ่มระยะดูดเพชร (+50px)", action: () => player.magnetRange += 50 },
        { name: "❤️ ฟื้นฟูและเพิ่ม Max HP (+10)", action: () => { player.maxHp += 10; player.hp = Math.min(player.hp + 10, player.maxHp); } }
    ];

    // ปรับอัปเกรดกรงจักรให้เพิ่มทีละ 1 อัน
    if (player.sawCount < 5) {
        upgrades.unshift({ 
            name: player.sawCount === 0 ? "🪚 รับกรงจักรหมุนรอบตัว (1 อัน)" : `🪚 เพิ่มกรงจักร (+1 อัน) [ปัจจุบัน: ${player.sawCount}]`, 
            action: () => player.sawCount = Math.min(5, player.sawCount + 1) 
        });
    }

    upgrades.sort(() => 0.5 - Math.random()).slice(0, 4).forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'upgrade-btn'; btn.innerText = opt.name;
        btn.onclick = () => { opt.action(); isPaused = false; Modals.levelUp.style.display = 'none'; gameLoop(); };
        Modals.upgradeOptions.appendChild(btn);
    });
    Modals.levelUp.style.display = 'block';
}

function checkNextStage() {
    const isBossStage = stage % 5 === 0;

    if (isBossStage && !bossDefeated) return;

    if (stageKills >= targetKills) {
        if (stage >= maxStages) { endGame(true); return; }
        stage++; stageKills = 0; targetKills = 5 + (stage - 1) * 3; bossSpawned = false; bossDefeated = false; enemies = [];
        if (stage === 16) showBanner(`STAGE 16: HARDCORE MODE!`, '#ff0000', 2500);
        else if (stage === 11) showBanner(`STAGE 11: ENEMIES EVOLVED!`, '#a000ff', 2500);
        else if (stage === 6) showBanner(`STAGE 6: BALANCED MODE!`, '#ff8800', 2500);
        else showBanner(`STAGE ${stage - 1} CLEARED!`, '#00ffcc', 2000);
        updateUI();
    }
}

function update() {
    if (isGameOver || isPaused) return;
    frameCount++;

    const up = keys['w'] || keys['W'] || keys['KeyW'] || keys['ArrowUp'] || keys['ไ'];
    const down = keys['s'] || keys['S'] || keys['KeyS'] || keys['ArrowDown'] || keys['ห'];
    const left = keys['a'] || keys['A'] || keys['KeyA'] || keys['ArrowLeft'] || keys['ฟ'];
    const right = keys['d'] || keys['D'] || keys['KeyD'] || keys['ArrowRight'] || keys['ก'];

    if (up && player.y - player.radius > 0) player.y -= player.speed;
    if (down && player.y + player.radius < canvas.height) player.y += player.speed;
    if (left && player.x - player.radius > 0) player.x -= player.speed;
    if (right && player.x + player.radius < canvas.width) player.x += player.speed;

    if (--player.attackCooldown <= 0) { autoAttack(); player.attackCooldown = player.attackRate; }

    if (player.sawCount > 0) {
        if (player.sawIsActive) {
            player.sawAngle += 0.05;
            if (++player.sawActiveTimer >= 360) { player.sawIsActive = false; player.sawActiveTimer = 0; }
        } else {
            if (++player.sawCooldownTimer >= 240) { player.sawIsActive = true; player.sawCooldownTimer = 0; }
        }
    }

    // จะไม่สปอว์นศัตรูเพิ่มเลยเมื่อบอสออก
    if (!bossSpawned && stageKills < targetKills && (enemies.length < 5 || frameCount % 12 === 0)) {
        spawnEnemy();
    }

    bullets.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy;
        if (Math.hypot(b.x - b.startX, b.y - b.startY) >= player.attackRange || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i, 1);
    });

    enemies.forEach((enemy, eIndex) => {
        const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
        enemy.x += Math.cos(angle) * enemy.speed; enemy.y += Math.sin(angle) * enemy.speed;

        if (Math.hypot(player.x - enemy.x, player.y - enemy.y) < player.radius + enemy.radius) {
            player.hp -= Math.max(1, (enemy.isBoss ? 25 : 10) - player.armor);
            if (!enemy.isBoss) enemies.splice(eIndex, 1);
            if (player.hp <= 0) { player.hp = 0; endGame(false); }
            updateUI();
        }

        if (player.sawCount > 0 && player.sawIsActive) {
            for (let i = 0; i < player.sawCount; i++) {
                const sAngle = player.sawAngle + (i * (Math.PI * 2 / player.sawCount));
                if (Math.hypot((player.x + Math.cos(sAngle) * 60) - enemy.x, (player.y + Math.sin(sAngle) * 60) - enemy.y) < 8 + enemy.radius) {
                    enemy.hp -= player.sawCount * 2;
                    if (enemy.hp <= 0) {
                        if (enemy.isBoss) bossDefeated = true;
                        gems.push({ x: enemy.x, y: enemy.y, radius: enemy.isBoss ? 8 : 4, value: enemy.isBoss ? 300 : 10 + (stage - 1) * 3 });
                        enemies.splice(eIndex, 1); score += enemy.isBoss ? 500 : 10; stageKills++; checkNextStage(); return;
                    }
                }
            }
        }

        bullets.forEach((b, bIndex) => {
            if (Math.hypot(b.x - enemy.x, b.y - enemy.y) < b.radius + enemy.radius) {
                enemy.hp -= b.damage; bullets.splice(bIndex, 1);
                if (enemy.hp <= 0) {
                    if (enemy.isBoss) bossDefeated = true;
                    gems.push({ x: enemy.x, y: enemy.y, radius: enemy.isBoss ? 8 : 4, value: enemy.isBoss ? 300 : 10 + (stage - 1) * 3 });
                    enemies.splice(eIndex, 1); score += enemy.isBoss ? 500 : 10; stageKills++; checkNextStage();
                }
            }
        });
    });

    gems.forEach((gem, gIndex) => {
        const dist = Math.hypot(player.x - gem.x, player.y - gem.y);
        if (dist < player.magnetRange) { gem.x += (player.x - gem.x) * 0.12; gem.y += (player.y - gem.y) * 0.12; }
        if (dist < player.radius + gem.radius) { gems.splice(gIndex, 1); addExp(gem.value); }
    });
    updateUI();
}

function updateUI() {
    UI.hp.textContent = player.hp; UI.maxHp.textContent = player.maxHp; UI.armor.textContent = player.armor;
    UI.speed.textContent = player.speed.toFixed(1); UI.bulletCount.textContent = player.bulletCount;
    UI.score.textContent = score; UI.level.textContent = player.level; UI.exp.textContent = player.exp;
    UI.nextExp.textContent = player.nextExp; UI.stage.textContent = stage;
    UI.kills.textContent = stageKills; UI.targetKills.textContent = targetKills;
    UI.expBar.style.width = `${Math.min(100, (player.exp / player.nextExp) * 100)}%`;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    gems.forEach(g => { ctx.beginPath(); ctx.arc(g.x, g.y, g.radius, 0, Math.PI * 2); ctx.fillStyle = g.radius > 5 ? '#ff00ff' : '#00ccff'; ctx.fill(); ctx.closePath(); });
    
    if (player.sawCount > 0 && player.sawIsActive) {
        for (let i = 0; i < player.sawCount; i++) {
            const sAngle = player.sawAngle + (i * (Math.PI * 2 / player.sawCount));
            ctx.beginPath(); ctx.arc(player.x + Math.cos(sAngle) * 60, player.y + Math.sin(sAngle) * 60, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#00ffff'; ctx.fill(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke(); ctx.closePath();
        }
    }

    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fillStyle = player.color; ctx.fill(); ctx.closePath();
    ctx.fillStyle = '#00ffcc'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(player.name, player.x, player.y - player.radius - 6);

    bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fillStyle = b.color; ctx.fill(); ctx.closePath(); });

    enemies.forEach(e => {
        ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fillStyle = e.color; ctx.fill(); ctx.closePath();
        const bW = e.isBoss ? 60 : 20, bH = e.isBoss ? 6 : 3, oY = e.isBoss ? 40 : 16;
        ctx.fillStyle = '#ff0000'; ctx.fillRect(e.x - bW / 2, e.y - oY, bW, bH);
        ctx.fillStyle = '#00ff00'; ctx.fillRect(e.x - bW / 2, e.y - oY, Math.max(0, (e.hp / e.maxHp) * bW), bH);
    });
}

function gameLoop() { update(); draw(); if (!isGameOver && !isPaused) requestAnimationFrame(gameLoop); }

function endGame(isVictory) {
    isGameOver = true;
    const t = document.getElementById('game-over-title');
    t.textContent = isVictory ? "🏆 VICTORY! 🏆" : "GAME OVER";
    t.style.color = isVictory ? "#00ffcc" : "#ff4444";
    document.getElementById('final-hero-name').textContent = player.name;
    document.getElementById('final-stage').textContent = stage;
    document.getElementById('final-score').textContent = score;
    Modals.gameOver.style.display = 'block';
}

function restartGame() {
    stage = 1; stageKills = 0; targetKills = 5; bossSpawned = false; bossDefeated = false; score = 0; frameCount = 0;
    Object.assign(player, { hp: 100, maxHp: 100, armor: 0, level: 1, exp: 0, nextExp: 5, attackRate: 30, damage: 1, bulletCount: 1, speed: 3.0, magnetRange: 100, sawCount: 0, sawAngle: 0, sawActiveTimer: 0, sawCooldownTimer: 0, sawIsActive: true, x: 400, y: 300 });
    bullets = []; enemies = []; gems = []; isGameOver = false; isPaused = false;
    Modals.gameOver.style.display = 'none'; Modals.levelUp.style.display = 'none';
    gameLoop();
}
</script>
</body>
</html>
